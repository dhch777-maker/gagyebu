<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤러리 작품 추출기</title>
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <div class="container">
        <h1>작품 사진 추출기</h1>
        <p class="subtitle">폰으로 찍은 사진을 올리면, 작품만 깔끔하게 추출해드려요</p>

        <div id="dropzone" class="dropzone">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <p>사진을 여기에 드래그하거나<br><button id="selectBtn" class="btn-select">파일 선택</button></p>
        </div>

        <div id="spinner" class="spinner" hidden>
            <p>AI가 작품을 감지하고 보정 중이에요... (첫 실행 시 좀 걸려요)</p>
        </div>

        <div id="preview" class="preview" hidden>
            <div class="preview-images">
                <div class="preview-card">
                    <h3>원본</h3>
                    <img id="originalImg" src="" alt="원본 사진">
                </div>
                <div class="preview-card">
                    <h3>추출 결과</h3>
                    <img id="processedImg" src="" alt="추출된 작품">
                </div>
            </div>
            <div id="message" class="message"></div>
            <div class="actions">
                <button id="confirmBtn" class="btn-confirm">확인 — 이대로 저장</button>
                <button id="inpaintBtn" class="btn-inpaint">부분 보정</button>
                <button id="manualBtn" class="btn-manual">수동 지정</button>
                <button id="retryBtn" class="btn-retry">다시하기</button>
            </div>
        </div>

        <div id="failMessage" class="fail-message" hidden>
            <p id="failText"></p>
            <div class="actions">
                <button id="failManualBtn" class="btn-manual">수동으로 지정하기</button>
                <button id="failRetryBtn" class="btn-retry">다른 사진으로 다시하기</button>
            </div>
        </div>

        <div id="manualSection" class="manual-section" hidden>
            <div class="source-toggle">
                <button id="srcOriginalBtn" class="src-btn active">원본 사진</button>
                <button id="srcProcessedBtn" class="src-btn">수정본</button>
            </div>
            <p id="manualHint" class="manual-hint">그림의 꼭지점 4개를 클릭하세요</p>
            <div class="manual-crop-area">
                <canvas id="manualCanvas"></canvas>
            </div>
            <div class="actions">
                <button id="manualApplyBtn" class="btn-confirm" disabled>적용</button>
                <button id="manualResetBtn" class="btn-retry">점 초기화</button>
                <button id="manualCancelBtn" class="btn-retry">취소</button>
            </div>
        </div>

        <div id="inpaintSection" class="inpaint-section" hidden>
            <p class="inpaint-hint">제거할 부분을 드래그로 칠해주세요 (마우스를 떼면 자동 보정됩니다)</p>
            <div class="inpaint-controls">
                <label for="brushSize">브러시 크기:</label>
                <input type="range" id="brushSize" min="5" max="100" value="30">
                <span id="brushSizeLabel">30px</span>
            </div>
            <div class="inpaint-canvas-area">
                <canvas id="inpaintCanvas"></canvas>
            </div>
            <div class="actions">
                <button id="inpaintUndoBtn" class="btn-retry" disabled>되돌리기 (Undo)</button>
                <button id="inpaintDoneBtn" class="btn-confirm">완료</button>
                <button id="inpaintCancelBtn" class="btn-retry">취소</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
